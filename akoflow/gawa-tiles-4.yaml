name: akf-wf-gawa-tiles-4way
spec:
  image: "ghcr.io/uffescience/gawa:tiles-v1"
  namespace: "akoflow"
  storageClassName: "hostpath"
  storageSize: "10Gi"
  storagePolicy:
    type: distributed
  mountPath: "/data-akoflow"
  activities:
    - name: prepare
      run: |
        set -eu
        export PYTHONPATH=/data${PYTHONPATH:+:$PYTHONPATH}
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
        conda run --no-capture-output -n gawa python -W ignore /data/gawa_tasks.py prepare --count 14
      memoryLimit: 4Gi
      cpuLimit: 1
    - name: tile-000
      run: |
        set -eu
        export PYTHONPATH=/data${PYTHONPATH:+:$PYTHONPATH}
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
        conda run --no-capture-output -n gawa python -W ignore /data/gawa_tasks.py tile --id 0
      memoryLimit: 4Gi
      cpuLimit: 1
      dependsOn:
        - "prepare"
    - name: tile-001
      run: |
        set -eu
        export PYTHONPATH=/data${PYTHONPATH:+:$PYTHONPATH}
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
        conda run --no-capture-output -n gawa python -W ignore /data/gawa_tasks.py tile --id 1
      memoryLimit: 4Gi
      cpuLimit: 1
      dependsOn:
        - "prepare"
