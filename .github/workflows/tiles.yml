name: Tile workflow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tests -v
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tiles
          load: true
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/uffescience/gawa:tiles-v1
            ghcr.io/uffescience/gawa:${{ github.sha }}
      - name: Container CLI and direct worker smoke test
        run: |
          docker run --rm --entrypoint conda ghcr.io/uffescience/gawa:tiles-v1 run --no-capture-output -n gawa python /data/gawa_tasks.py --help
          docker run --rm --entrypoint conda ghcr.io/uffescience/gawa:tiles-v1 run --no-capture-output -n gawa python -c "import sys; from lib.tile_tasks import run_gawa_tile_job; assert callable(run_gawa_tile_job); assert 'parsl' not in sys.modules"
